<svg width="600" height="500" viewBox="0 0 600 500" xmlns="http://www.w3.org/2000/svg">

  <defs>

    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">

      <stop offset="0%" stop-color="#00C853"/>

      <stop offset="100%" stop-color="#FF9800"/>

    </linearGradient>

    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">

      <stop offset="0%" stop-color="#00E676"/>

      <stop offset="100%" stop-color="#FFC107"/>

    </linearGradient>

    <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%">

      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000000" flood-opacity="0.3"/>

    </filter>

  </defs>



  <!-- Background -->

  <rect width="600" height="500" fill="#0b1d26"/>



  <!-- ===== ICON MARK ===== -->

  <g transform="translate(230,90)" filter="url(#softShadow)">



    <!-- Rounded square badge -->

    <rect x="0" y="0" width="140" height="140" rx="34" fill="url(#grad1)"/>



    <!-- Speech-bubble shaped brain outline (line art, professional) -->

    <path d="

      M 30 42

      C 30 26 44 14 62 14

      L 78 14

      C 96 14 110 26 110 42

      L 110 74

      C 110 90 96 102 78 102

      L 58 102

      L 42 118

      L 44 100

      C 34 96 30 86 30 74

      Z"

      fill="none" stroke="#ffffff" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>



    <!-- Brain fold lines inside bubble -->

    <path d="M 46 40 C 52 34 62 34 66 40" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>

    <path d="M 72 36 C 78 30 88 32 92 38" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>

    <path d="M 42 58 C 46 66 46 74 40 80" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>



    <!-- Soundwave / confidence bars rising (inside bubble, right side) -->

    <rect x="70" y="68" width="6" height="14" rx="3" fill="#ffffff"/>

    <rect x="80" y="60" width="6" height="22" rx="3" fill="#ffffff"/>

    <rect x="90" y="50" width="6" height="32" rx="3" fill="#ffffff"/>

  </g>



  <!-- ===== WORDMARK ===== -->

  <text x="300" y="290" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="700" fill="#ffffff" letter-spacing="0.5">MindVoice</text>



  <!-- Accent underline -->

  <rect x="225" y="305" width="150" height="4" rx="2" fill="url(#grad2)"/>



  <!-- Tagline -->

  <text x="300" y="338" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#b0bac2" letter-spacing="0.3">Speak with confidence, every time</text>



</svg>